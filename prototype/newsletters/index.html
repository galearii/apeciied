<!doctype html>
<!--
  PROTOTYPE, throw away. Wayfinder ticket: "How should Newsletters lay out its
  14 issues without uneven cards?" (galearii/apeciied issue 5).
  Three structurally different Newsletters pages, switchable via ?variant=A|B|C
  (or the bar at the bottom, or the left/right arrow keys). All text is the
  Wix page's text; download links carry type and size as aplx does. PDFs aren't
  included here, so the links go nowhere. Open the file in a browser.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROTOTYPE · Newsletters | APEC IIED</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.11"></script>
<style type="text/tailwindcss">
  @theme {
    --color-copper: #B46A2C; --color-copper-dark: #78471D; --color-copper-mid: #DA9B66;
    --color-copper-light: #ECCDB2; --color-peach: #FAE8DB; --color-ink: #1E1E1E;
    --color-mute: #696666; --color-paper: #F5F5F5;
  }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans TC", sans-serif; }
</style>
</head>
<body class="bg-white text-ink antialiased">
<header class="border-b border-black/5 bg-paper">
  <div class="mx-auto flex max-w-6xl items-center justify-between px-4 py-4">
    <a href="#" class="flex items-center gap-3"><img src="img/iied.svg" alt="" class="h-10 w-14"><span class="text-xs font-semibold leading-tight">Institute of Innovation &amp;<br>Education Development</span></a>
    <nav class="hidden gap-5 text-sm text-mute md:flex"><a>Home</a><a>About</a><a>Organization</a><a>APEC HRDWG EDNET</a><a class="text-copper">Newsletters</a><a>APEC Project ▾</a><a>Contact</a></nav>
  </div>
</header>
<main id="root"></main>
<footer class="mt-16 bg-ink py-8 text-center text-xs text-white/70">Follow us on Instagram · 2026 © APEC Institute of Innovation &amp; Education Development</footer>

<div class="fixed bottom-4 left-1/2 z-50 flex -translate-x-1/2 items-center gap-3 rounded-full bg-black px-4 py-2 text-sm text-white shadow-2xl ring-2 ring-fuchsia-400">
  <button id="prev" class="px-2">←</button><span id="label"></span><button id="next" class="px-2">→</button>
</div>

<script>
const issues = [{"n": 14, "topics": ["2026 APEC Youth Engagement Workshop: Connectivity and Partnerships for Openness, Innovation, and Cooperation"], "size": "3 MB", "cover": "img/issue-14.jpg"}, {"n": 13, "topics": ["Building An Asia-Pacific Community to Prosper Together: The APEC 2026 Strategic Briefing", "Priorities for APEC: Openness, Innovation, Cooperation"], "size": "2 MB", "cover": "img/issue-13.jpg"}, {"n": 12, "topics": ["APEC Forum on Women and Youth Empowerment", "2025 Recap: APEC Youth Engagement Workshop", "2025 Recap: APEC Industry-Academia Collaboration Workshop", "2025 Recap: APEC Forum on Women and Youth Empowerment"], "size": "2 MB", "cover": "img/issue-12.jpg"}, {"n": 11, "topics": ["2025 APEC Youth Engagement Workshop", "2025 APEC Industry-Academia Cooperation Workshop", "Upcoming Event: APEC Forum on Women and Youth Empowerment"], "size": "1 MB", "cover": "img/issue-11.jpg"}, {"n": 10, "topics": ["IIED in 2025 APEC EDNET & APEC Future Education Forum (AFEF)", "Priorities for APEC 2025: Connect, Innovate, Prosper"], "size": "2 MB", "cover": "img/issue-10.jpg"}, {"n": 9, "topics": ["IIED in 2024 APEC Future Education Consortium", "2024 APEC Youth Capacity-Building Training & Model APEC", "2024 APEC TVET Workshop", "2024 APEC Forum on Women and Youth Empowerment"], "size": "2 MB", "cover": "img/issue-09.jpg"}, {"n": 8, "topics": ["2024 APEC Youth Capacity-Building Training & Model APEC", "2024 APEC Industry-Academia Collaboration Workshop", "IIED Upcoming Event"], "size": "2 MB", "cover": "img/issue-08.jpg"}, {"n": 7, "topics": ["APEC HRDWG & EDNET Meetings in Peru", "Priorities for APEC 2024 Peru"], "size": "1 MB", "cover": "img/issue-07.jpg"}, {"n": 6, "topics": ["APEC IIED Participation in the 19th APEC Future Education Consortium Steering Committee", "Fruitful Results from APEC Youth Capacity Building, APEC TVET Workshop, and APEC Youth Impact Forum"], "size": "6 MB", "cover": "img/issue-06.jpg"}, {"n": 5, "topics": ["2023 APEC Youth Capacity-Building Training & Model APEC", "Upcoming Events: APEC TVET Workshop", "Upcoming Events: APEC Youth Impact Forum"], "size": "4 MB", "cover": "img/issue-05.jpg"}, {"n": 4, "topics": ["APEC HRDWG & EDNET MEETINGS in United States", "Priorities for APEC 2023 United States"], "size": "2 MB", "cover": "img/issue-04.jpg"}, {"n": 3, "topics": ["Fruitful Results: Review on APEC Forum on Entrepreneurship for the Future of Work and many more recent events!"], "size": "2 MB", "cover": "img/issue-03.jpg"}, {"n": 2, "topics": ["Fruitful Result of 2022 YIE Online Forum", "APEC HRDWG & EDNET Meetings in Thailand"], "size": "2 MB", "cover": "img/issue-02.jpg"}, {"n": 1, "topics": ["Year of Tiger Season's Greetings", "Priorities for APEC 2022 Thailand"], "size": "1 MB", "cover": "img/issue-01.jpg"}]; // newest first
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
const dl = (i, cls='') => `<a href="#" class="${cls}">Download (PDF, ${i.size})</a>`;
const topics = i => i.topics.map(t => `<li>${esc(t)}</li>`).join('');
const title = '<section class="bg-paper py-12 text-center"><h1 class="text-4xl font-semibold">Newsletter</h1></section>';

const variants = {
  // A: the Wix grid, fixed. Same card everywhere; cover aspect locked, download pinned to the bottom.
  A: { name: 'Even card grid', render: () => title + `
    <section class="mx-auto grid max-w-6xl grid-cols-2 gap-6 px-4 py-12 md:grid-cols-3 lg:grid-cols-4">
      ${issues.map(i => `
      <article class="flex flex-col overflow-hidden rounded-lg border border-black/10 bg-white">
        <a href="#"><img src="${i.cover}" alt="Cover of Newsletter ${i.n}" class="aspect-[1/1.414] w-full object-cover"></a>
        <div class="flex flex-1 flex-col p-4">
          <h2 class="font-semibold">Newsletter ${i.n}</h2>
          <ul class="mt-2 flex-1 list-disc space-y-1 pl-4 text-sm text-mute">${topics(i)}</ul>
          ${dl(i, 'mt-4 inline-block rounded-full bg-copper px-4 py-2 text-center text-sm text-white hover:bg-copper-dark')}
        </div>
      </article>`).join('')}
    </section>` },

  // B: newest issue featured, the rest as a scannable list (no grid, so nothing to be uneven).
  B: { name: 'Latest + issue list', render: () => { const [f, ...rest] = issues; return title + `
    <section class="mx-auto max-w-5xl px-4 py-12">
      <div class="grid items-center gap-8 rounded-xl bg-peach p-6 md:grid-cols-[16rem_1fr]">
        <img src="${f.cover}" alt="Cover of Newsletter ${f.n}" class="w-full rounded shadow-lg">
        <div>
          <p class="text-sm font-semibold uppercase tracking-wide text-copper">Latest issue</p>
          <h2 class="mt-1 text-3xl font-semibold">Newsletter ${f.n}</h2>
          <ul class="mt-4 list-disc space-y-1 pl-5">${topics(f)}</ul>
          ${dl(f, 'mt-6 inline-block rounded-full bg-copper px-5 py-2 text-white hover:bg-copper-dark')}
        </div>
      </div>
      <h2 class="mt-14 text-xl font-semibold">Earlier issues</h2>
      <ol class="mt-4 divide-y divide-black/10 border-y border-black/10">
        ${rest.map(i => `
        <li class="grid grid-cols-[4rem_1fr] gap-4 py-4 md:grid-cols-[4rem_8rem_1fr_auto] md:items-center">
          <img src="${i.cover}" alt="" class="w-16 rounded border border-black/10">
          <h3 class="font-semibold">Newsletter ${i.n}</h3>
          <ul class="col-start-2 text-sm text-mute md:col-start-auto">${i.topics.map(t => `<li>${esc(t)}</li>`).join('')}</ul>
          ${dl(i, 'col-start-2 text-sm text-copper underline underline-offset-4 md:col-start-auto md:whitespace-nowrap')}
        </li>`).join('')}
      </ol>
    </section>`; } },

  // C: a cover shelf. Covers only, equal by construction; topics and download open in a panel.
  C: { name: 'Cover shelf + detail panel', render: () => title + `
    <section class="mx-auto max-w-6xl px-4 py-12">
      <p class="mb-6 text-sm text-mute">Choose an issue to see what's in it.</p>
      <div class="grid grid-cols-3 gap-4 sm:grid-cols-4 md:grid-cols-7">
        ${issues.map(i => `
        <button data-n="${i.n}" class="group text-left">
          <img src="${i.cover}" alt="Newsletter ${i.n}" class="aspect-[1/1.414] w-full rounded object-cover shadow transition group-hover:-translate-y-1 group-hover:shadow-lg group-focus:ring-4 group-focus:ring-copper">
          <span class="mt-2 block text-center text-sm font-semibold">No. ${i.n}</span>
        </button>`).join('')}
      </div>
    </section>
    <dialog id="panel" class="m-auto w-full max-w-lg rounded-xl p-0 backdrop:bg-black/50"></dialog>`,
    after: () => {
      const panel = document.getElementById('panel');
      document.querySelectorAll('[data-n]').forEach(b => b.onclick = () => {
        const i = issues.find(x => x.n == b.dataset.n);
        panel.innerHTML = `<div class="grid grid-cols-[8rem_1fr] gap-5 p-6">
          <img src="${i.cover}" alt="" class="w-full rounded shadow">
          <div><h2 class="text-2xl font-semibold">Newsletter ${i.n}</h2>
          <ul class="mt-3 list-disc space-y-1 pl-5 text-sm">${topics(i)}</ul>
          ${dl(i, 'mt-5 inline-block rounded-full bg-copper px-4 py-2 text-sm text-white')}</div></div>
          <form method="dialog" class="border-t border-black/10 p-3 text-right"><button class="text-sm text-mute">Close</button></form>`;
        panel.showModal();
      });
    } },
};

const keys = Object.keys(variants);
const cur = () => new URL(location).searchParams.get('variant') ?? 'A';
function show(k) {
  if (!keys.includes(k)) k = 'A';
  document.getElementById('root').innerHTML = variants[k].render();
  variants[k].after?.();
  document.getElementById('label').textContent = `${k} (${variants[k].name})`;
  const u = new URL(location); u.searchParams.set('variant', k); history.replaceState(null, '', u);
}
const step = d => show(keys[(keys.indexOf(cur()) + d + keys.length) % keys.length]);
document.getElementById('prev').onclick = () => step(-1);
document.getElementById('next').onclick = () => step(1);
addEventListener('keydown', e => {
  if (e.target.closest('input,textarea,[contenteditable]')) return;
  if (e.key === 'ArrowLeft') step(-1); if (e.key === 'ArrowRight') step(1);
});
show(cur());
</script>
</body>
</html>

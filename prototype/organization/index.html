<!-- Prototype switcher: not part of the design -->
<div id="switcher" class="fixed bottom-4 left-1/2 z-50 flex -translate-x-1/2 items-center gap-3 rounded-full bg-black px-4 py-2 text-sm text-white shadow-2xl ring-2 ring-fuchsia-400">
  <button id="prev" class="px-2">←</button><span id="label"></span><button id="next" class="px-2">→</button>
</div>

<script>
  const keys = ['A', 'B', 'C'];
  function inlineSvgs(root) {
    for (const el of root.querySelectorAll('[data-svg]')) el.innerHTML = `<img src="img/${el.dataset.svg}.svg" alt="" class="h-full w-full object-contain">`;
  }
  function show(k) {
    if (!keys.includes(k)) k = 'A';
    const t = document.getElementById(k);
    const root = document.getElementById('variant-root');
    root.replaceChildren(t.content.cloneNode(true));
    document.getElementById('label').textContent = `${k} (${t.dataset.name})`;
    const u = new URL(location); u.searchParams.set('variant', k); history.replaceState(null, '', u);
    inlineSvgs(root); inlineSvgs(document.querySelector('header'));
  }
  const cur = () => new URL(location).searchParams.get('variant') ?? 'A';
  const step = d => show(keys[(keys.indexOf(cur()) + d + keys.length) % keys.length]);
  document.getElementById('prev').onclick = () => step(-1);
  document.getElementById('next').onclick = () => step(1);
  addEventListener('keydown', e => {
    if (e.target.closest('input,textarea,[contenteditable]')) return;
    if (e.key === 'ArrowLeft') step(-1);
    if (e.key === 'ArrowRight') step(1);
  });
  show(cur());
</script>

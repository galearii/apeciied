- title: "APEC Forum on Entrepreneurship for the Future of Work: Accelerating Regional Economic Recovery and Digital Inclusion for Women and Youth in the Post Pandemic Era"
  date: "November 16-18, 2022"
  funding: "APEC Sub-fund: Women and Economy"
  cosponsors: "Indonesia; Japan; Korea; Mexico; Peru; Singapore; Thailand"
  text: >-
    The APEC Forum on Entrepreneurship for the Future of Work was the first physical event after the pandemic that invited speakers and delegates from the APEC region to participate and to discuss the post-pandemic job market. The forum attracted greater over-seas participation than ever before. 91 delegates from 16 APEC members economies registered and participated in the 3-day event. For more information, please visit the <a href="https://taipeiyie.com/en-2022-forum/">website</a>.
  image: "/assets/images/events-2022-yie-forum.png"
  alt: "YIE APEC 2022 logo"
  width: 741
  height: 397
- title: "2022 APEC Forum on Student Mobility and Innovative Education in the Post Pandemic Era"
  date: "September 19-20, 2022"
  funding: "self-funded"
  text: >-
    During the past two years, the COVID-19 pandemic has caused significant impact on cross-regional talent cultivation and educational exchange. In order to restore and enhance regional cooperation and to push forward educational and economic growth, this project aims to accelerate innovative education development and human capital cultivation by strengthening the stakeholder partnerships and promoting high-quality education in the digital age. This project also proposes to host a meaningful forum to discuss how to facilitate student mobility and to innovate education in the post pandemic time.
  image: "/assets/images/events-2022-student-mobility-forum.png"
  alt: "APEC Forum on Student Mobility and Innovative Education in the Post-pandemic Era logo"
  width: 752
  height: 418
- title: "2022 APEC TVET Workshop on Success Models of Sustainable and Circular Economy: Green Manufacturing and Intelligent Public Transport"
  date: "September 12-13, 2022"
  funding: "self-funded"
  text: >-
    Placing sustainable travel and transportation at the heart of post-pandemic economic recovery calls for more integrated actions to strengthen green technology-enabled infrastructure for high efficiency and quality in public transport systems. Smart mobility solutions provide new lenses to the linkage of urban and rural as the integral part of economic recovery and green growth. The primary objective of the project is to create and accelerate an aligned implementation of interdisciplinary collaboration among the government, academia and industry in sustainable transport technology. A two-day workshop will include capacity building, model discussions, ideas exchange from exemplary schools and AI-based organizations and businesses, discovering innovative potentials together with feasibility to apply green technology and AI-enabled transportation solutions and talent training schemes. For more information, please visit the <a href="https://www.taipei-tvet.com/2022-hrdwg-ednet-project/">website</a>.
  image: "/assets/images/events-2022-tvet-workshop.png"
  alt: "2022 APEC Taipei TVET Workshop logo"
  width: 499
  height: 377
- title: "APEC Digital Economy and Innovative Entrepreneurship Online Forum: Enhancing Inclusive Participation and Digital Upskilling for Youths"
  date: "March 23-24, 2022"
  funding: "APEC Sub-fund: Digital Innovation"
  text: >-
    This event is a two half-day online forum on digital economy and youth innovative entrepreneurship, held in March 2022 to bring together government officials from related sectors, successful start-up founders, young entrepreneurs, start-up incubation centers or accelerators, and representatives from venture capital companies. For this project, we will also invite past participants from previous projects to share their entrepreneurial journey, the regional resources that they leverage to grow their business, the current market trends, and the most up-to-date and necessary digital skills. For more information, please visit the <a href="https://taipeiyie.com/en-2022-online-forum/">website</a>.
  image: "/assets/images/events-2022-yie-online-forum.jpg"
  alt: "YIE APEC 2022 Online Forum logo"
  width: 428
  height: 241
- title: "APEC Forum on Digital Innovation and Entrepreneurship (II): Building Capacity and Collaborative Connectivity for Women and Young Entrepreneurs"
  date: "July 12-14, 2021"
  funding: "APEC Sub-fund: Women and Economy"
  cosponsors: "Indonesia; Japan; Korea; Malaysia; Mexico; Singapore; Papua New Guinea"
  text: >-
    This 3-day forum “APEC Forum on Digital Innovation and Entrepreneurship (II): Building Capacity and Collaborative Connectivity for Women and Young Entrepreneurs” includes a half-day forum covering youth entrepreneurship enhancement and a half-day forum specifically targeted at young female entrepreneurs-to-be, engaging them in a productive dialogue on female empowerment and inclusion in the digital economy. A field visit to successful start-up companies or local innovation centers/incubators will also be included in the program to demonstrate the entrepreneurial environment. For more information, please visit the <a href="https://taipeiyie.com/en-2021-forum/">website</a>.
  image: "/assets/images/events-2021-yie-forum.png"
  alt: "YIE logo: the Taipei skyline in a circle"
  width: 424
  height: 424
- title: "Regional Industry-Academia Collaboration for Talent Development and Inclusive Growth: Skills Training, Internships, Jobs and Women"
  date: "May 7, 2021"
  funding: "APEC Sub-fund: Women and Economy"
  cosponsors: "Indonesia; Malaysia; Mexico; New Zealand; Philippines; Singapore; Thailand; United States"
  text: >-
    Under the ongoing talent development scheme, the 2019 project extends the 2018 project for successful implementation of the model to create seamless collaboration between industry and academia. The strategic alliance seeks to provide talent solutions to narrow the skills gap. To strengthen the alliance, it is hoped that APEC economies' delegates not merely attend but effectively acquire the essential components to collaborate in the near future. The key objective of this project is: Strategize seamless network of cross-regional and interdisciplinary collaboration through industry-driven vocational education and training programs that cultivate talents to meet industry demands across economies and to encourage female participation in non-traditional sector. For more information, please visit the <a href="https://www.taipei-tvet.com/agenda/">website</a>.
  image: "/assets/images/events-2021-tvet-workshop.png"
  alt: "APEC 2021 Taipei TVET Workshop logo"
  width: 423
  height: 279
- title: "APEC Forum on Digital Innovation and Entrepreneurship: Building Capacity and Collaborative Connectivity for Young Entrepreneurs"
  date: "October 7-9, 2019"
  funding: "self-funded"
  cosponsors: "Republic of Korea; Thailand; Papua New Guinea"
  text: >-
    The project intends to develop capacity through the transfer and development of knowledge, skills and technical know-how among experienced entrepreneurs and entrepreneurs-to-be from various Asia-Pacific economies. One of the major themes of the workshop is female entrepreneurship, related to inspiring female creativity and improving gender inclusion. Experience sharing during the workshop will further facilitate both internal and regional replicability through dissemination of acquired skills within the participants' home economies and other regional sectors. For more information, please visit the <a href="https://www.yietaipei.com/">website</a>.
  image: "/assets/images/events-2019-yie-forum.png"
  alt: "YIE APEC 2019 logo"
  width: 563
  height: 283
- title: "Regional Industry-Academia Collaboration for Talent Development: An Exchange of Skills Training, Internships, and Jobs (II)"
  date: "Sep 16-18, 2019"
  funding: "self-funded"
  cosponsors: "Indonesia; Mexico; Singapore; New Zealand; Thailand; Malaysia; USA; the Philippines"
  text: >-
    Under the ongoing talent development scheme, the 2019 project extends the 2018 project for successful implementation of the model to create seamless collaboration between industry and academia. The strategic alliance seeks to provide talent solutions to narrow the skills gap. To strengthen the alliance, it is hoped that APEC economies' delegates not merely attend but effectively acquire the essential components to collaborate in the near future. Besides, the 2019 workshop takes on two new tasks to traverse today's workplace landscape in the APEC region, which are to identify the demands and challenges faced by women and how to prepare learners for the technology-enabled/digital economy. Thus, the 2019 project includes forum discussions, workshop demos, and CTE industry tours along with our website, where the latest related information will be posted highlighting women's ability to use the resources available to navigate their careers and digital development as an integral part of economic growth.
  image: "/assets/images/events-2019-tvet-workshop.png"
  alt: "APEC 2019 logo"
  width: 479
  height: 193
- title: "Asia-Pacific Youth Forum on Digital Innovation and Entrepreneurship: Building Capacity and Collaborative Connectivity for Young Entrepreneurs"
  date: "October 4-6, 2018"
  funding: "self-funded"
  cosponsors: "Republic of Korea; Thailand; Papua New Guinea"
  text: >-
    Entrepreneurial education is a process relying on the transfer of knowledge and ingenuity from successful entrepreneurs to entrepreneurs-to-be, leading to long-term capacity building and innovation initiatives. We are focusing on the most needed and transformative sectors of the digital economy, which offer promise of sustained and sustainable growth and inclusive employment. For more information, please visit the <a href="https://www.yietaipei.com/2018/">website</a>.
  image: "/assets/images/events-2018-yie-forum.png"
  alt: "YIE 2018 logo: coloured lines over a map of Taiwan in a circle"
  width: 306
  height: 303
- title: "Regional Industry-Academia Collaboration for Talent Development: An Exchange of Skills Training, Internships, and Jobs"
  date: "June 5-7, 2018"
  funding: "APEC central-fund"
  cosponsors: "Indonesia; Korea; Philippines; Singapore; Thailand; United States; Viet Nam"
  text: >-
    To address the issue of youth employability by closing the gap between education and skills, this project re-strategizes collaborative partnerships among APEC member economies. As a follow-up event to the April 2017 TVET (Technological and Vocational Education and Training) Forum hosted in Chinese Taipei, this project highlights a new model of exchange, including professional and technical skills training, internships, talent mobility, and workplace experiences for APEC youth. It will promote and demonstrate a series of strategically-designed, industry-driven TVET programs with partner companies in Chinese Taipei to strengthen connectivity among APEC member economies. A collaborative network built by academic institutions, private sector, and government organizations guarantees long-term exchange of resources and support for multi-lateral enablement.
  image: "/assets/images/events-2018-tvet-workshop.png"
  alt: "APEC Chinese Taipei logo"
  width: 608
  height: 266
- title: "Skills Training in Industry-Academia Collaboration in CTE: Best Practices and Implementation in the Engineering, Hospitality and Innovative Entrepreneurship Fields"
  date: "April 25-27, 2017"
  funding: "self-funded"
  cosponsors: "Brunei Darussalam; China; Korea; Malaysia; Peru; Philippines; Russia; Singapore; Thailand; Viet Nam"
  text: >-
    The project, Skills Training in Industry-Academia Collaboration in CTE (Career and Technical Education): Best practices and implementation in the engineering, hospitality and innovative entrepreneurship fields, is a follow-up project to the one completed in 2015, when APEC member economies were invited to come and discuss collaboration models in the fields of engineering, health care, and hospitality and tourism. By 2017, the first couple of Chinese Taipei student cohorts will have already graduated and been employed by partner companies, so delegates from APEC economies may compare the fruits of such collaborations through interaction with the industry and the students themselves. This workshop will be an opportunity for participating economies to discuss the effects of such partnerships and other models in vocational education which can be applied to CTE in each economy.
  image: "/assets/images/events-2017-tvet-workshop.png"
  alt: "APEC Chinese Taipei logo"
  width: 482
  height: 192
- title: "Industry-Academia Collaboration Models in Technological and Vocational Education and Training: Best Practices in Curriculum Design and Implementation in the Healthcare, Engineering and Hospitality Fields"
  date: "September 22-24, 2015"
  funding: "self-funded"
  cosponsors: "Brunei Darussalam; Malaysia; Mexico; Papua New Guinea; Peru; Philippines; Russia; Singapore; Thailand; Viet Nam"
  text: >-
    This project aims to promote and demonstrate a series of strategically-designed industry-driven TVET programs that through the collaboration and networking between academic institutions, private sector, and government organizations, cultivate an educated and skilled workforce that meets industry needs for APEC economies. This project also promotes human capital development, people-to-people/institutional connectivity, and SME development in the APEC region.
  image: "/assets/images/events-2015-tvet-workshop.png"
  alt: "APEC Chinese Taipei logo"
  width: 655
  height: 381
- title: "Sustainable TVET for a Rapidly Changing World Economy: Building an international collaboration network"
  date: "April 24-25, 2014"
  funding: "self-funded"
  cosponsors: "Australia; Indonesia; Japan; Malaysia; Russia; United States"
  text: >-
    This Project aims to share experiences, compare different systems, and provide feasible recommendations with the goal of achieving mutual understanding in policies and systems, which is expected to encourage mobility of skilled workforce across the region and further facilitate trade between member economies. This goal of improving the quality of TVET, as a priority area, will, of course, be achieved through mutual collaboration/cooperation in the form of policy exchange and stakeholders' involvement, as suggested by China and the Philippines.
  image: "/assets/images/events-2014-tvet-workshop.png"
  alt: "APEC Chinese Taipei logo"
  width: 790
  height: 316

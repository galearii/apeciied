# The APEC events the institute has hosted, newest first, as the APEC
# Events page lists them. `date` and `funding` render as "date (funding)".
# `text` is HTML: plain text plus links. `image` is the event's banner or
# logo, with its `alt` text and pixel `width` and `height`.
- title: "APEC Forum on Women and Youth Empowerment: Enhancing Digital Competitiveness and Inclusive Economic Growth through Innovative Enterprise Education"
  date: "November 5-7, 2025"
  funding: "APEC Sub-fund: Women and the Economy"
  cosponsors: "Chile; Korea; Malaysia; New Zealand; Philippines; United States"
  text: >-
    To promote education collaboration and talent development across the Asia-Pacific region, the Ministry of Education (MOE) is hosting the 2025 APEC Forum on Women and Youth Empowerment: Enhancing Digital Competitiveness and Inclusive Economic Growth through Innovative Enterprise Education. This forum invited around 70 participants, including representatives from 19 APEC member economies and youth delegates from Taiwan, to engage in diverse exchanges. This forum focuses on education and innovation issues for women and youth in the digital era, aiming to cultivate inclusive and creative talent by fostering cross-economy collaborations, in line with APEC's sustainable development goals.
  image: "/assets/images/events-2025-forum-women-youth-empowerment.jpg"
  alt: "APEC Forum on Women and Youth Empowerment: Enhancing Digital Competitiveness and Inclusive Economic Growth through Innovative Enterprise Education banner"
  width: 800
  height: 450
- title: "Leveraging Digitalization for Talent Inclusion and Empowerment: Facilitating Economic Transitions by Academia-Industry Partnership"
  date: "August 27-28, 2025"
  funding: "APEC Sub-fund: Digital Innovation"
  cosponsors: "Chile; Japan; Korea; Malaysia; New Zealand; Philippines; Thailand"
  text: >-
    This year's workshop aligns with APEC 2025's priority of "Innovate - Promoting Digital Innovation in the Asia-Pacific Region". It will focus on Leveraging Digitalization for Talent Inclusion and Empowerment: Facilitating Economic Transitions by Academia-Industry Partnership, examining how digital transformation can be harnessed to cultivate a future-ready workforce. Participants - including policymakers, educators, industry leaders, and experts - will exchange insights and successful strategies on inclusive digital transformation, sustainable collaboration, and cross-regional talent development. The program also features case studies, focus group discussions, and a site visit to Lunghwa University of Science and Technology to showcase practical models of collaboration in action.
  image: "/assets/images/events-2025-tvet-workshop.jpg"
  alt: "TVET 2025 logo"
  width: 800
  height: 271
- title: "2025 APEC Youth Engagement Workshop: Connectivity, Partnership, and Opportunities"
  date: "July 3-4, 2025"
  text: >-
    This project aims to empower regional youth by enhancing their communication skills, fostering cross-border collaboration, and deepening their understanding of global issues. Through a two-day interactive training program, participants will engage with experts and stakeholders from APEC-related fields to explore how communication and language skills are essential in navigating cross-regional platforms and international collaboration settings.
  image: "/assets/images/events-2025-youth-engagement-workshop.jpg"
  alt: "2025 APEC Youth Engagement Workshop: Connectivity, Partnership, and Opportunities banner"
  width: 778
  height: 213
- title: "APEC Forum on Women and Youth Empowerment: Advancing Innovative Education and Enhancing Workforce Skills for a Sustainable and Inclusive Future"
  date: "November 13-15,2024"
  funding: "APEC Sub-fund: Women and Economy"
  cosponsors: "Chile; Indonesia; Japan; Korea; Malaysia; New Zealand; Peru; Singapore; Thailand"
  text: >-
    To promote inter-regional educational cooperation and strengthen economic development, the Ministry of Education is holding the “2024 APEC Women and Youth Empowerment Forum: Promoting Innovative Education and Enhancing Labor Skills for a Sustainable and Inclusive Future,” which officially commences today (November 13th). Approximately 80 participants, including youth from 16 APEC economies and students from our country, have gathered in Taipei for three days of exchange activities. The forum focuses on innovative education, empowering youth and women, and collaboratively promoting sustainable development and inclusive economic growth in the APEC region.
  image: "/assets/images/events-2024-forum-women-youth-empowerment.jpg"
  alt: "APEC Forum on Women and Youth Empowerment banner"
  width: 800
  height: 238
- title: "Best Practices for Inclusive Innovation, Digital Sustainability and Cross-regional Talent Development"
  date: "August 28-29,2024"
  funding: "APEC Sub-fund: Digital Innovation"
  cosponsors: "Chile; Indonesia; Korea; Malaysia; Peru; Thailand; USA"
  text: >-
    This year's workshop continues the tradition of fostering collaboration and innovation among 13 APEC economies. Participants, including government officials and educators, will engage in discussions and share best practices that promote inclusive innovation, digital sustainability, and cross-regional talent development. The workshop will also include site visits to educational institutions and enterprises, providing participants with firsthand insights into successful models of collaboration.
  image: "/assets/images/events-2024-tvet-workshop.png"
  alt: "TVET 2024 APEC Workshop Taipei logo"
  width: 800
  height: 297
- title: "2024 APEC Youth Capacity Building Training & Model APEC"
  date: "July 4-5, 2024"
  text: >-
    This program gathered policymakers, government officials and experts who work in APEC related sectors to share with the regional youth regarding how APEC operates. A Model APEC conference was also organized for the young participants to learn more about how issues are discussed in a regional economic forum, and how to present and voice their opinions in an official setting.
  image: "/assets/images/events-2024-youth-training-model-apec.jpg"
  alt: "2024 APEC Youth Capacity-Building Training & Model APEC banner, July 4-5, 2024"
  width: 467
  height: 223
- title: "APEC Youth Impact Forum: Promoting Local Sustainability and Inclusive Growth to Enhance Post-pandemic Regional Resilience and Prosperity"
  date: "October 25-27, 2023"
  funding: "APEC Sub-fund: Women and Economy"
  cosponsors: "Indonesia; Japan; Korea; Malaysia; Philippines; Thailand; Thailand; United States"
  text: >-
    To promote cross-regional education cooperation and strengthen post-pandemic economic recovery, more than 70 young people are invited from 16 APEC member economies to participate in this important three-day event. The Forum focuses on local revitalization and inclusive development, enhancing regional economic resilience in the post-pandemic era. It aims to showcase best practices of policies and educational initiatives for regional revitalization and sustainable entrepreneurship and discuss how to predict the future development of the regional economy by fostering local industries.
  image: "/assets/images/events-2023-youth-impact-forum.png"
  alt: "APEC Youth Impact Forum logo"
  width: 329
  height: 114
- title: "Digital and Inclusive Talents Cultivation and Technology (AI)-Enabled Collaboration: TVET's Integrative Models of Skills and Trainings"
  date: "August 31 - September 1, 2023"
  funding: "APEC Sub-fund: Digital Innovation"
  cosponsors: "Chile; Indonesia; Japan; Korea; Malaysia; Thailand"
  text: >-
    The workshop aimed to demonstrate how to narrow the skills gap and cultivate digital and AI talents through technological vocational education, providing an in-depth introduction to the collaborative model between the academia sector and industry sector.
  image: "/assets/images/events-2023-tvet-workshop.png"
  alt: "TVET 2023 APEC Industry-Academia Collaboration Workshop logo"
  width: 261
  height: 116

# Builds the site, tests included, on every pull request and every push to
# master, so each Dependabot PR shows green or red before anyone merges it.
# Ruby comes from .ruby-version and Node from .nvmrc, as on Netlify.
name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
